spring:
  application:
    name: parlamento

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:parlamento}
    username: ${DB_USER:parlamento}
    password: ${DB_PASSWORD:parlamento}

  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade do Flyway; o Hibernate só confere se as entidades batem.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

parlamento:
  ingestao:
    legislatura: 57
    data-apresentacao-inicio: 2025-01-01
    tipos-proposicao: [PL, PEC, PLP, PDL]

camara:
  api:
    base-url: ${CAMARA_API_URL:https://dadosabertos.camara.leg.br/api/v2}
    connect-timeout: 5s
    read-timeout: 30s
    itens-por-pagina: 100   # máximo aceito pela fonte
    retry:
      max-retentativas: 4
      atraso-inicial: 1s
      multiplicador: 2.0
      atraso-maximo: 30s
