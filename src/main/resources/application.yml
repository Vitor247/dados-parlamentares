spring:
  application:
    name: parlamento

  datasource:
    # DB_URL completa tem prioridade (bancos gerenciados já a fornecem, com ?sslmode=require);
    # sem ela, a URL é montada a partir de host/porta/nome.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:parlamento}}
    username: ${DB_USER:parlamento}
    password: ${DB_PASSWORD:parlamento}

  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade do Flyway; o Hibernate só confere se as entidades batem.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  # PORT é a variável que as plataformas de hospedagem usam para ditar a porta.
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health   # só o health check; nada de métricas ou configuração expostas

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json
  # Respostas de erro são documentadas explicitamente em cada endpoint; sem isso o springdoc
  # anexaria a todos os endpoints todo tipo de erro tratado no @RestControllerAdvice.
  override-with-generic-response: false

parlamento:
  seguranca:
    # Sem chave configurada, os endpoints /admin ficam bloqueados (403).
    admin-api-key: ${ADMIN_API_KEY:}
    # Origens do frontend, separadas por vírgula. Padrão: servidor de dev do Vite.
    cors-origens: ${CORS_ORIGINS:http://localhost:5173}

  ingestao:
    legislatura: 57
    # Início da legislatura 57: o perfil de cada deputado mostra o mandato inteiro.
    data-apresentacao-inicio: 2023-02-01
    tipos-proposicao: [PL, PEC, PLP, PDL]
    # Situação enriquecida há mais tempo que isso volta a ser buscada no enriquecimento.
    validade-situacao: 7d

camara:
  api:
    base-url: ${CAMARA_API_URL:https://dadosabertos.camara.leg.br/api/v2}
    connect-timeout: 5s
    read-timeout: 30s
    itens-por-pagina: 100   # máximo aceito pela fonte
    retry:
      max-retentativas: 4
      atraso-inicial: 1s
      multiplicador: 2.0
      atraso-maximo: 30s
